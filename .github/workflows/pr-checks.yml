name: Tax Planner PR checks

on:
  pull_request:
    branches: [main, chore/baseline-eslint-cleanup-20261030]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test -- --run
      - name: Lint
        run: npm run lint
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
      - name: Dependency audit inventory (non-blocking)
        if: ${{ !cancelled() }}
        run: |
          npm audit --json > audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          console.log('Audit metadata:', JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          for (const [name, v] of Object.entries(audit.vulnerabilities ?? {})) {
            const advisories = (v.via ?? []).filter(item => typeof item !== 'string').map(item => ({
              title: item.title, url: item.url, range: item.range, severity: item.severity,
            }));
            console.log('PACKAGE', JSON.stringify({ name, severity: v.severity, direct: v.isDirect,
              range: v.range, fixAvailable: v.fixAvailable, advisories }));
          }
          NODE
          rm -f audit.json
